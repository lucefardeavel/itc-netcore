# Branch-local regression for the lab candidate branches (PR #2 review item 6: the combined commit status listed no
# external checks). Unit suite only - no database, no secrets, read-only token; it never runs for the frozen branches
# (main, feat/reseller-system-v1, wp9/red-team-rc) and deploys nothing. The integration / HTTP / CHR suites need the
# disposable databases and the RouterOS lab and stay in the lab (evidence in the PR description).
name: lab-unit
on:
  push:
    branches: ['lab/**']
  pull_request:
    branches: ['wp9/red-team-rc']
permissions:
  contents: read
concurrency:
  group: lab-unit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  unit:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - uses: shivammathur/setup-php@bf6b4fbd49ca58e4608c9c89fba0b8d90bd2a39f # 2.35.5
        with:
          php-version: '8.2'
          extensions: mbstring, dom, xml, xmlwriter, tokenizer, json, pdo, pdo_mysql
          tools: composer:v2
          coverage: none
      - name: Test tooling (tests/composer.lock, dev only, never deployed)
        working-directory: tests
        run: composer install --no-interaction --no-progress --prefer-dist
      - name: Unit suite
        run: php tests/vendor/bin/phpunit -c tests/phpunit.xml --do-not-cache-result tests/Unit
