server default {
listen {
	type = auth
	ipaddr = 127.0.0.1
	port = 1812
}
authorize {
	update control {
		&Auth-Type := Accept
	}
}
authenticate {
}
post-auth {
	update request {
		&Tmp-String-1 := "%{time_since:us}"
	}
	update request {
		&Tmp-String-6 := "%{expr:(%{time_since:us} - %l * 1000000 - %M) / 1000}"
	}
	update request {
		&Tmp-String-2 := "%{time_since:us}"
	}
	update request {
		&Tmp-String-3 := "%{time_since:us}"
	}
	update request {
		&Tmp-String-7 := "%{expr:(%C - %M) / 1000 + (%c - %l) * 1000}"
	}
	update request {
		&Tmp-String-4 := "%{time_since:us}"
	}
	update reply {
		&Reply-Message := "new=%{Tmp-String-6} a=%{Tmp-String-1} b=%{Tmp-String-2} old=%{Tmp-String-7} c=%{Tmp-String-3} d=%{Tmp-String-4} arr=%l%M"
	}
}
}
