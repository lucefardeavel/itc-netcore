# Disposable test databases for the reseller project test suite.
# Development/test only. No published ports, tmpfs storage, throwaway credentials
# supplied through the environment by dev/test/run-tests.sh. Never used for production.
name: nuxbill-reseller-test

services:
  mariadb:
    image: mariadb:10.11
    environment:
      MARIADB_ROOT_PASSWORD: ${WP1_DB_ROOT_PASSWORD:?set by run-tests.sh}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 3s
      timeout: 5s
      retries: 60

  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: ${WP1_DB_ROOT_PASSWORD:?set by run-tests.sh}
    tmpfs:
      - /var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$$MYSQL_ROOT_PASSWORD\" --silent"]
      interval: 3s
      timeout: 5s
      retries: 60

  # WP4 (owner decision Q1): FreeRADIUS 3.2.8 with the project configuration, one per engine, pinned by digest.
  freeradius-mariadb: &freeradius
    image: freeradius/freeradius-server:3.2.8@sha256:af6fd34a5b7826b6245008732f43fbc0432eb23d23e5de7106371b2941e70a4b
    environment:
      WP1_DB_ROOT_PASSWORD: ${WP1_DB_ROOT_PASSWORD:?set by run-tests.sh}
      NUXR_RADIUS_SECRET: ${NUXR_RADIUS_SECRET:?set by run-tests.sh}
      NUXR_RADIUS_DB_HOST: mariadb
    volumes:
      - ../../install/freeradius:/nuxr/install:ro
      - ./freeradius:/nuxr/test:ro
    entrypoint: ["sh", "/nuxr/test/start.sh"]

  freeradius-mysql:
    <<: *freeradius
    environment:
      WP1_DB_ROOT_PASSWORD: ${WP1_DB_ROOT_PASSWORD:?set by run-tests.sh}
      NUXR_RADIUS_SECRET: ${NUXR_RADIUS_SECRET:?set by run-tests.sh}
      NUXR_RADIUS_DB_HOST: mysql

  php82:
    build:
      context: .
      dockerfile: Dockerfile
    image: nuxbill-reseller-test-php82
    working_dir: /repo
    volumes:
      - ../..:/repo
    environment:
      WP1_DB_ROOT_PASSWORD: ${WP1_DB_ROOT_PASSWORD:?set by run-tests.sh}
      NUXR_RADIUS_SECRET: ${NUXR_RADIUS_SECRET:?set by run-tests.sh}
    entrypoint: ["php"]
    profiles: ["runner"]
