# Development/test only: the test runner container (compose network, no published ports).
client nuxr_test_network {
	ipaddr = 0.0.0.0/0
	secret = $ENV{NUXR_RADIUS_SECRET}
	require_message_authenticator = yes
	nas_type = other
}

# WP8 A1 - PPPoE session guard contract tests (tests/Integration/Wp4/SessionGuardContractTest.php). TEST-NET-1 NAS
# identities that never send packets: they only give an open radacct row (NAS-IP-Address) the production NAS type
# mikrotik_snmp, so the stock checkrad answers "not logged in" (as shipped, it cannot run SNMP) and the post-auth
# guard decides. 192.0.2.10 has a guard credential entry (start.sh) but is unreachable; 192.0.2.11 has none.
client nuxr_guard_nas_unreachable {
	ipaddr = 192.0.2.10/32
	secret = $ENV{NUXR_RADIUS_SECRET}
	require_message_authenticator = yes
	nas_type = mikrotik_snmp
}
client nuxr_guard_nas_no_credentials {
	ipaddr = 192.0.2.11/32
	secret = $ENV{NUXR_RADIUS_SECRET}
	require_message_authenticator = yes
	nas_type = mikrotik_snmp
}
